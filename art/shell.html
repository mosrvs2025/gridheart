<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>

@font-face { font-family: 'Gridheart Title'; src: url('title.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'Gridheart Body'; src: url('body.ttf') format('truetype'); font-display: block; }

html, body, #canvas { margin: 0; padding: 0; border: 0; }

body {
	color: #f4e2be;
	background-color: #1c1622;
	overflow: hidden;
	touch-action: none;
}

#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute;
	inset: 0;
	background-color: #1c1622;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	visibility: hidden;
	text-align: center;
	padding: 0 24px;
}

#title {
	font-family: 'Gridheart Title', monospace;
	font-size: clamp(20px, 5vw, 40px);
	color: #f6ca6a;
	letter-spacing: 2px;
}

#tagline, #hint, #status-notice {
	font-family: 'Gridheart Body', monospace;
	font-size: clamp(9px, 1.6vw, 13px);
	letter-spacing: 1px;
	color: #b8aeb4;
	line-height: 1.8;
}

#hint { color: #6f6472; }

/* a progress bar made of cells, because of course it is */
#status-progress { display: flex; gap: 3px; }

#status-progress span {
	width: 10px;
	height: 10px;
	background: #2a2233;
	box-shadow: inset 0 0 0 1px #3a3044;
}

#status-progress span.on { background: #f4e2be; box-shadow: inset 0 0 0 1px #8d7f63; }

#status-notice {
	display: none;
	max-width: 30rem;
	color: #e08a86;
	border: 1px solid #5b3943;
	background: #2a1c24;
	padding: 14px 18px;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="title">GRIDHEART</div>
			<div id="tagline">your health is not a number - it is a shape</div>
			<div id="status-progress"></div>
			<div id="hint">first load pulls the engine down; it is cached after that</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	const CELLS = 24;
	for (let i = 0; i < CELLS; i++) {
		statusProgress.appendChild(document.createElement('span'));
	}

	let lastFraction = -1;

	function setProgress(fraction) {
		if (fraction < 0 && lastFraction >= 0) {
			return;
		}
		lastFraction = fraction;
		const lit = fraction < 0 ? -1 : Math.round(fraction * CELLS);
		const cells = statusProgress.children;
		for (let i = 0; i < CELLS; i++) {
			// with no total to go on, run a light back and forth instead
			const on = lit < 0 ? (i === Math.floor((Date.now() / 90) % CELLS)) : i < lit;
			cells[i].classList.toggle('on', on);
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		setProgress(-1);
		const spinner = setInterval(() => {
			if (initializing) {
				setProgress(-1);
			} else {
				clearInterval(spinner);
			}
		}, 90);
		engine.startGame({
			'onProgress': function (current, total) {
				setProgress(current > 0 && total > 0 ? current / total : -1);
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
